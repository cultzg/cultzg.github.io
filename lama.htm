<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ollama API Request Form</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<style>
  /* Add your CSS styling here */
  body {
    font-family: Arial, sans-serif;
  }
  #response { margin-top: 20px; }
</style>
</head>
<body>

<div id="api-form">
  <h2>Ollama API Request Form</h2>
  
  <!-- You can add more form fields as needed -->
  <select id="model" name="model"><option value="phi4-mini">phi4-mini</option></select>
  <textarea id="prompt" name="prompt"></textarea><br/>
  <button onclick="makeApiCall()">Send API Call</button>

  <div id="response">Response will be shown here.</div>
</div>


<script>
// Function to make an AJAX POST request without reloading the page
function makeApiCall() {
  const model = $('#model').val();
  const prompt = $('#prompt').val();
  
  $.ajax({
    url: 'http://localhost:3000/lama/generate',
    type: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({ "model": model, "prompt": prompt, "stream": false }),
    success: function(response) {
      console.log('Server response:', response);
      document.getElementById("response").innerHTML = `
        Status Code: ${response.status}
        Message: ${response.message}
      `;
    },
    error: function(error) {
      // Handle errors here
      console.error('Error making API call', error);
      document.getElementById("response").innerHTML = 'An error occurred.';
    }
  });
}

// You can also attach the makeApiCall() to a button click without needing an inline onclick attribute in your HTML.
</script>

</body>
</html>
