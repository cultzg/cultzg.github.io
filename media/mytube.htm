<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js" integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/_js/jquery.youtube.js?t=3"></script>  
</head>
<body>
<input type="text" id="clientId" value="156375032528-m8aevqnbem81qp63eqtbkic4fb7rae6p.apps.googleusercontent.com"> 
<button onclick="myPlaylists($('#clientId').val())">PlayList</button>
<script>
function printList(content) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  window.location.replace(url);
  //sleep(1000);
  //URL.revokeObjectURL(url);
}
async function getPlaylists(playList, apiKey) {
    try {
      console.log(playList);
        const { playlistTitle, items } = await $.youtube.getPlaylistItems(playList, apiKey);
        const m3u = $.youtube.createM3U(items);
        printList(m3u);
    } catch (error) {
      console.log(error)
    }
}
async function myPlaylists(clientId) {
  $.youtube.GoogleSignin(clientId, async function(){
    let myList = [];
    await $.youtube.getMyPlaylists();
    $.youtube.googlePlaylists.forEach((playlist) => {
      myList.push(`https://www.youtube.com/playlist?list=${playlist.id}`);
    });
    printList(myList.join('\n'));
  });
}

const param = new URLSearchParams(window.location.search);
const apiKey = param.get('apiKey');
const playList = param.get('playList');
$('#clientId').val( param.get('clientId') );
if(apiKey && playList) {
  getPlaylists(playList, apiKey);
} 
</script>
</body>
</html>
