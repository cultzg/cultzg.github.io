<style>
.tree { padding-left: 20px; }
.folder { font-weight: bold; cursor: pointer; user-select: none; margin: 4px 0; }
.folder::before { content: "📁 "; }
.folder.open::before { content: "📂 "; }
.nested { display: block; }
.active { display: block; }
</style>
<!-- 목록 -->
<h2>📑 북마크</h2><hr>
<div id="bookmark"></div>
<div class="flex right"><button onClick="$('#add-book').modalTaglet({})">추가</button></div>

<!--항목 추가-->
<div id="add-book" class="ui-modal-content">
    <h3>📝 항목 추가</h3><hr>
    <p>추가할 정보를 입력해주세요.</p>
    종류
    <select>
        <option>북마크</option>
        <option>폴더</option>
    </select>
    <input name="name" placeholder="이름">
    <input name="link" placeholder="https://www.bookmark.org">
</div>
<script>
$.getJSON("book.json", function(bookmarkData) {
    $('#bookmark').treeTaglet(bookmarkData, '<a href="{url}">↳ {name}</a>');
});
</script>
