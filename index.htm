<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta charset="utf-8">
<meta http-equiv="no-cache">
<meta http-equiv="Pragma: no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="X-UA-Compatable" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>::Oops!</title>
<link rel="stylesheet" href="css/base.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js" integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/jquery.tpl.js?"></script>
</head>
<body>
<header id="head"></header>
<nav id="menu"><li><a href="{link}">{name}</a></li></nav>
<section></section>
<aside id="side"></aside>
<footer id="foot"></footer>
<template id="tmpl_section" slot="section">
<tr>
    <td>{id}</td>
    <td>{title}</td>
    <td>{body}</td>
</tr>
</template>
<script>
$(document).ready(function(){
    const tmpls = {
        menu : [{
                name:'인공지능',
                link:'/ai'
            },{
                name:'미디어',
                link:'/media'
            },{
                name:'정보캐기',
                link:'/info'
            }
        ],
        foot: [{
            link1: '<a href="">Link1</a>',
            link2: '<a href="">Link2</a>'
        }]
    }
    
    $('#menu').tpl(tmpls.menu);
    $('#side').tpl(tmpls.menu, 'table');
    $('#foot').tpl(tmpls.foot);

    const url ='https://jsonplaceholder.typicode.com/posts';
    $.get(url, function(rows){
        $('#tmpl_section').tpl(rows,'table');
    });
});
</script>
</body>
</html>
