<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta charset="utf-8">
<meta http-equiv="no-cache">
<meta http-equiv="Pragma: no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="X-UA-Compatable" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>::Oops!</title>
<link rel="stylesheet" href="css/base.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js" integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/jquery.tpl.js?"></script>
</head>
<body>
<header id="head"></header>
<nav id="menu" class="menu"></nav>
<section></section>
<aside id="side"></aside>
<footer id="foot"></footer>
<template name="head" slot="#head"></template>
<template name="menu" slot="#menu"></template>
<template name="side" slot="#side"></template>
<template name="foot" slot="#foot"></template>
<script>
$(window).on('load', function(){
    const tmpts = {
        head: [{link1:"<!--img src='img/logo.png'>", link2:"<audio controls hidden><scource src=''>지원하지 않는 브라우저입니다.</audio>"}],
        menu: [{menu1:"<a href='?menu=1'>Menu1</a>",menu2:"Menu2",menu3:"Menu3"}],
        side: [{menu1:"<a href='/'>사이드 메뉴</a>"}],
        foot: [{link1:"<a href='mailto:cultz@kakao.com'>@Contact</a>"}]
    };
    $.each(tmpts, function (key,val) {
        $(`template[name=${key}]`).tpl(val,'ul');
    });

    const url ='https://jsonplaceholder.typicode.com/posts';
    //const url = '/api'
    $(window).load(url, function(json){
        const rows = JSON.parse(json);
        $('section').tpl(rows,'table');
    });
});
</script>
</body>
</html>
