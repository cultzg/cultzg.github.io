<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta charset="utf-8">
<meta http-equiv="no-cache">
<meta http-equiv="Pragma: no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="X-UA-Compatable" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>MeTube</title>
<link rel="stylesheet" href="_css/index.css">
<link rel="stylesheet" href="_css/layout.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js" integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="_js/jquery.taglet.js?=2"></script>
</head>
<body>
<header><h1><a href="/">HOME</a></h1></header>
<main>
<nav class="menu">
    <li><a href="#" onclick="loadContent('{link}')"">{name}</a></li>
</nav>
<section></section>
<aside class="side">
    <li><a href='{link}' target=_blank>{name}</a></li>
</aside>
</main>
<footer></footer>
<div id="_modal" class="modal"></div>
<script>
const API_URL = document.location.host=='localhost' ? 'http://localhost:3000' : 'http://cultz.duckdns.org/api'

function loadContent(path='/main') {
    const param = new URLSearchParams(window.location.search);
    let cp = (param.get('cp')||path).replace(/\.html?$/i, '');
    const curl = new URL(cp=='/index' ? path : cp, document.location.href);
    const time = Date.now();
    $('section').load( curl.pathname + '.htm?' + curl.search + '&t=' + time);
}
function getPages(page, total, listSize=10, pageSize=10) {
    const max = Math.ceil(total/listSize);              //최대페이지
    const mid = Math.floor(pageSize/2);                 //중간페이지
    const size= pageSize>max ? max : pageSize;          //출력갯수
    let sta = page > mid ? page-mid : 1;                //시작페이지
    let end = sta+size;                                 //끝페이지
    if(end > max) end=max;                              //최대초과시
    if(end-sta<size) sta=end-size+1;                    //max가까운곳 처리   
    return Array.from({length: size}, (_, i)=> sta+i);
}

$(document).ready(function(){
    $.getJSON("menu.json", function(data) {
        $('nav').loadTaglet(data.menu);
        $('aside').loadTaglet(data.side);
        $('footer').loadTaglet(data.foot);
    }).fail(error=> {
        console.log("MENU:"+error);
    });
    loadContent('/book');
});


window.addEventListener('click', (e) => {// 모달 외부 배경 클릭 시 닫기
    if ($(e.target) === $('#_modal')) {
        $('#_modal').hide();
    }
});

</script>
</body>
</html>
