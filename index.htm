<!--#include file="head.htm" -->
<body>
<header id="head"></header>
<nav id="menu"><li><a href="{link}">{name}</a></li></nav>
<section></section>
<aside id="side"></aside>
<footer id="foot"></footer>
<template id="tmpl_section" slot="section">
<tr>
    <td>{id}</td>
    <td>{title}</td>
    <td>{body}</td>
</tr>
</template>
<script>
$(document).ready(function(){
    const tmpls = {
        menu : [{
                name:'인공지능',
                link:'/ai'
            },{
                name:'미디어',
                link:'/media'
            },{
                name:'정보캐기',
                link:'/info'
            }
        ],
        foot: [{
            link1: '<a href="">Link1</a>',
            link2: '<a href="">Link2</a>'
        }]
    }
    
    $('#menu').tpl(tmpls.menu);
    $('#side').tpl(tmpls.menu, 'table');
    $('#foot').tpl(tmpls.foot);

    const url ='https://jsonplaceholder.typicode.com/posts';
    $.get(url, function(rows){
        $('#tmpl_section').tpl(rows,'table');
    });
});
</script>
</body>
</html>
